upstream api {
    server api:3000;
}

upstream mock_auth {
    server mock-auth:3100;
}

upstream web {
    server web:80;
}

upstream admin {
    server admin:80;
}

upstream tiles {
    server tiles:3200;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /mock-auth/ {
        proxy_pass http://mock_auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Внутренняя проверка JWT для тайлов: /api/me отдаёт X-Object-Types
    location = /internal/tile-auth {
        internal;
        proxy_pass http://api/me;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Векторные тайлы объектов: проверяем JWT, подставляем права в types
    location ~ ^/tiles/objects/(?<z>[0-9]+)/(?<x>[0-9]+)/(?<y>[0-9]+)$ {
        auth_request /internal/tile-auth;
        auth_request_set $object_types $upstream_http_x_object_types;

        proxy_pass http://tiles/tiles_objects/$z/$x/$y?types=$object_types;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin *;
    }

    # Статика SPA админки
    location /admin/ {
        proxy_pass http://admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Статика SPA из контейнера web
    location / {
        proxy_pass http://web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
