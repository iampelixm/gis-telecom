upstream api {
    server api:3000;
}

upstream mock_auth {
    server mock-auth:3100;
}

upstream web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /mock-auth/ {
        proxy_pass http://mock_auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Статика SPA из контейнера web
    location / {
        proxy_pass http://web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
